name: PrismRoll
options:
  bundleIdPrefix: com.jonluca
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.1.0'
    CURRENT_PROJECT_VERSION: '15'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F35YQQ5672
    OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    exactVersion: 1.19.5
  AppsFlyerStrict:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework-Strict.git
    exactVersion: 7.0.2
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.19.2
  PrismOptimizer:
    path: Packages/PrismOptimizer
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.9.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  PrismRoll:
    type: application
    platform: iOS
    sources:
      - path: PrismRoll
        excludes: ['**/*.md']
    configFiles:
      Debug: Config/PrismRoll.xcconfig
      Release: Config/PrismRoll.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonluca.prismroll
        INFOPLIST_FILE: PrismRoll/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PrismRoll/Resources/PrismRoll.entitlements
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    dependencies:
      - package: AppsFlyerStrict
        product: AppsFlyerLib-Strict
      - sdk: AdServices.framework
      - package: Firebase
        product: FirebaseAnalyticsCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: PrismOptimizer
        product: CPrismOptimizer
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
  PrismRollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrismRollTests
        excludes: ['__Snapshots__/**']
      - path: release-draft/storekit/PrismRoll-Local.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PrismRoll
      - package: SnapshotTesting
        product: SnapshotTesting
  PrismRollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrismRollUITests
      - path: release-draft/storekit/PrismRoll-Local.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PrismRoll
schemes:
  PrismRoll:
    build:
      targets:
        PrismRoll: all
    test:
      targets: [PrismRollTests, PrismRollUITests]
