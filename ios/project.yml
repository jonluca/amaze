name: PrismRoll
options:
  bundleIdPrefix: com.jonluca
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '5'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F35YQQ5672
    OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.9.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    exactVersion: 3.1.0
targets:
  PrismRoll:
    type: application
    platform: iOS
    sources:
      - path: PrismRoll
        excludes: ['**/*.md']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonluca.prismroll
        INFOPLIST_FILE: PrismRoll/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PrismRoll/Resources/PrismRoll.entitlements
    dependencies:
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
  PrismRollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PrismRollTests
      - path: release-draft/storekit/PrismRoll-Local.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PrismRoll
  PrismRollUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PrismRollUITests
      - path: release-draft/storekit/PrismRoll-Local.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PrismRoll
schemes:
  PrismRoll:
    build:
      targets:
        PrismRoll: all
    test:
      targets: [PrismRollTests, PrismRollUITests]
