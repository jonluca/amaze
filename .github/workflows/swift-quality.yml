name: Swift Quality

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/swift-quality.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/swift-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Swift formatting and correctness rules
        run: python3 ios/scripts/swift_quality.py check
